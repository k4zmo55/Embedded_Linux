# Embedded Linux kitabının ayar dosyası.
#
# - [book]  : kitabın adı ve bölüm sırası
# - [vars]  : kursa bağlı değerler (kart, sürümler, IP'ler...). Bölümlerde
#             {{grup.isim}} olarak yazılır, `python tools/book.py build`
#             çalışınca gerçek değerle değiştirilir. Bir değeri burada
#             değiştirip build alırsan bütün bölümler ve terminal
#             görüntüleri güncellenir.
#
# Değerler başka değerlere {{...}} ile referans verebilir.

[book]
title = "Embedded Linux"
subtitle = "BeagleBone Black ile Adım Adım"
preface = "00_preface.md"

[[book.parts]]
title = "Başlarken"
chapters = ["01_bbb_hardware.md", "02_serial_console.md"]

[[book.parts]]
title = "Boot Süreci"
chapters = ["03_boot_process.md", "04_sd_card_boot.md", "05_emmc_boot.md"]

[[book.parts]]
title = "U-Boot ile Çalışmak"
chapters = ["06_uboot_uenv.md", "07_uart_boot.md", "08_tftp_boot.md", "09_uboot_build.md"]

[[book.parts]]
title = "Linux Kernel"
chapters = ["10_linux_kernel.md", "11_device_tree.md"]

[[book.parts]]
title = "Root Filesystem"
chapters = ["12_busybox_rootfs.md", "13_buildroot.md"]

[[book.parts]]
title = "Uygulama Geliştirme ve Donanım"
chapters = ["14_eclipse.md", "15_gpio_sysfs.md", "16_external_led.md", "17_seven_segment.md", "18_four_digit_7segment.md", "19_mpu6050.md", "20_lcd_16x2.md"]

[[book.parts]]
title = "Kernel Sürücüleri"
chapters = ["21_kernel_module.md", "22_char_driver.md", "23_gpio_platform_driver.md", "24_i2c_iio_driver.md"]

# ---------------------------------------------------------------------------

[vars.course]
repo = "https://github.com/niekiran/EmbeddedLinuxBBB"
prebuilt_url = "{{course.repo}}/tree/master/pre-built-images/Angstrom_Demo"

[vars.board]
name = "BeagleBone Black"
short = "BBB"
soc = "AM3358"

# Kursun hazır (prebuilt) imajları: SD kart, seri boot ve TFTP bölümleri
[vars.prebuilt]
uboot_version = "2013.04"
mlo_file = "MLO-beaglebone-{{prebuilt.uboot_version}}"
uboot_file = "u-boot-beaglebone-{{prebuilt.uboot_version}}-r0.img"
rootfs_file = "Angstrom-systemd-image-eglibc-ipk-v2012.12-beagleboard.rootfs.tar.xz"
kernel_version = "3.8.13"
console = "ttyO0"
debian_image = "bone-debian-10.3-iot-armhf-2020-04-06-4gb.img.xz"
# Seri boot klasöründeki imajlar (pre-built-images/serial-boot)
serial_spl_version = "2017.03"
serial_uboot_version = "2016.11-rc1"
# Kursun güncel SD kart imajları (pre-built-images/SD-boot)
sd_uboot_version = "2022.04"
sd_kernel_version = "5.10.168"

# Kartın eMMC'sine yüklenen güncel BeagleBoard Debian imajı (eMMC bölümü).
# Donanım bölümleri (15-20) kernel 5.10'un sabit GPIO numaralarına göre
# yazıldığı için imajın v5.10-ti çeşidi seçilir.
[vars.debian]
version = "13.7"
date = "2026-10-09"
kernel_flavor = "v5.10-ti"
image = "am335x-debian-{{debian.version}}-base-{{debian.kernel_flavor}}-armhf-{{debian.date}}-4gb.img.xz"
page = "https://www.beagleboard.org/distros/beaglebone-black-debian-13-7-2026-10-09-iot-v5-10-ti"

# Linux kernel (Linux kernel bölümü)
[vars.kernel]
branch = "5.10"
version = "5.10.162"
repo = "https://github.com/beagleboard/linux.git"
dir = "linux"
defconfig = "bb.org_defconfig"
console = "ttyS0"
loadaddr = "0x80008000"

# Root filesystem (BusyBox bölümü)
[vars.rootfs]
busybox_version = "1.36.1"
busybox_url = "https://busybox.net/downloads/busybox-{{rootfs.busybox_version}}.tar.bz2"
dropbear_version = "2022.83"
dropbear_url = "https://matt.ucc.asn.au/dropbear/releases/dropbear-{{rootfs.dropbear_version}}.tar.bz2"
dir = "~/bbb/rootfs"
usb_board_ip = "192.168.7.2"
usb_host_ip = "192.168.7.1"

# Buildroot (Buildroot bölümü) — LTS sürüm; değerler bu sürümün configs/beaglebone_defconfig'inden
[vars.buildroot]
version = "2026.02.3"
url = "https://buildroot.org/downloads/buildroot-{{buildroot.version}}.tar.gz"
dir = "buildroot-{{buildroot.version}}"
defconfig = "beaglebone_defconfig"
kernel_version = "6.18.1"
kernel_defconfig = "omap2plus"
uboot_version = "2026.01"
toolchain = "Bootlin armv7-eabihf glibc stable 2025.08-1"
busybox_version = "1.37.0"
dropbear_version = "2026.91"

# Eclipse (Eclipse bölümü)
[vars.eclipse]
version = "2026-09"
package = "Eclipse IDE for C/C++ Developers"
release_site = "https://download.eclipse.org/releases/{{eclipse.version}}/"
toolchain_win_tarball = "gcc-linaro-{{build.gcc_version}}-{{build.linaro_date}}-i686-mingw32_arm-linux-gnueabihf.tar.xz"
toolchain_win_url = "https://releases.linaro.org/components/toolchain/binaries/{{build.linaro_release}}/arm-linux-gnueabihf/{{eclipse.toolchain_win_tarball}}"
project = "hello_bbb"
target_user = "debian"

# Kendi derlediğimiz U-Boot ve toolchain (U-Boot derleme bölümü)
[vars.build]
uboot_version = "2022.04"
uboot_defconfig = "am335x_evm_defconfig"
uboot_tarball = "u-boot-{{build.uboot_version}}.tar.bz2"
uboot_dir = "u-boot-{{build.uboot_version}}"
uboot_url = "https://ftp.denx.de/pub/u-boot/{{build.uboot_tarball}}"
eth_device = "ethernet@4a100000"
cross_compile = "arm-linux-gnueabihf-"
gcc_version = "7.5.0"
linaro_series = "7.5"
linaro_date = "2019.12"
linaro_release = "{{build.linaro_series}}-{{build.linaro_date}}"
toolchain_dir = "gcc-linaro-{{build.gcc_version}}-{{build.linaro_date}}-x86_64_arm-linux-gnueabihf"
toolchain_tarball = "{{build.toolchain_dir}}.tar.xz"
toolchain_url = "https://releases.linaro.org/components/toolchain/binaries/{{build.linaro_release}}/arm-linux-gnueabihf/{{build.toolchain_tarball}}"

[vars.network]
host_ip = "192.168.27.1"
board_ip = "192.168.27.2"
netmask = "255.255.255.0"
prefix = "24"
subnet = "192.168.27.x"
host_iface = "enp3s0"
tftp_dir = "/var/lib/tftpboot"
nfs_dir = "/srv/nfs/bbb"
